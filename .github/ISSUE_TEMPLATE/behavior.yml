name: Behavior failure / 行为反馈
description: A reproducible improvement, regression or failure with concrete evidence
body:
  - type: textarea
    id: task
    attributes:
      label: Redacted task and expected outcome / 脱敏任务与预期结果
      description: State whether this is a real, reconstructed or synthetic example.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Client, model, settings and skill version / 环境
      description: Include permissions, other instructions and evidence of actual skill-file reading; unknown is OK.
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: Baseline and skill results / 两组实际结果
      description: Include outputs, file differences or command results. Write NOT_RUN for missing conditions. Remove secrets and private data.
    validations:
      required: true
  - type: textarea
    id: costs
    attributes:
      label: Unwanted changes, verbosity, time or token cost / 副作用与成本
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 隐私
      options:
        - label: I removed secrets and have permission to share this material.
          required: true
